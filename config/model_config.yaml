# LightGBM hyperparameters and training settings for the demand forecast model.
# Loaded by src/train.py (yaml.safe_load); never hardcode params in code.

model:
  # Tweedie regression is the M5-winning objective for intermittent demand:
  # it models a mass at zero plus a positive continuous tail, matching retail
  # sales where many SKU-days are zero and the rest are right-skewed counts.
  objective: tweedie
  # tweedie_variance_power, learning_rate, num_leaves and n_estimators below were
  # chosen by the SCDF-18 subset hyperparameter sweep (see docs/SCDF-18 report).
  tweedie_variance_power: 1.2
  metric: rmse
  n_estimators: 3000
  learning_rate: 0.03
  num_leaves: 127
  min_child_samples: 100
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  random_state: 42
  n_jobs: -1
  verbosity: -1

training:
  val_days: 28           # M5 evaluation horizon (last 28 days held out)
  early_stopping_rounds: 50
